<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 96" width="500" height="96" preserveAspectRatio="none">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406" />
      <stop offset="50%" stop-color="#111115" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>
  </defs>
  <!-- Edge-to-edge black censor bar so 100% of bounding box covers the eyes -->
  <rect x="2" y="2" width="496" height="92" rx="3" fill="url(#barGrad)" stroke="#EF4444" stroke-width="3.5" />
  <!-- Subtle scanlines -->
  <line x1="8" y1="22" x2="492" y2="22" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
  <line x1="8" y1="48" x2="492" y2="48" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.18" />
  <line x1="8" y1="74" x2="492" y2="74" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.07" />
  <!-- Corner brackets -->
  <path d="M 12 24 L 12 10 L 28 10" fill="none" stroke="#EF4444" stroke-width="3" />
  <path d="M 488 24 L 488 10 L 472 10" fill="none" stroke="#EF4444" stroke-width="3" />
  <path d="M 12 72 L 12 86 L 28 86" fill="none" stroke="#EF4444" stroke-width="3" />
  <path d="M 488 72 L 488 86 L 472 86" fill="none" stroke="#EF4444" stroke-width="3" />
  <!-- Red glitch shadow text -->
  <text
    x="253"
    y="69"
    text-anchor="middle"
    font-family="Impact, 'Arial Black', 'Plus Jakarta Sans', sans-serif"
    font-weight="900"
    font-size="60"
    letter-spacing="9"
    fill="#DC2626"
  >
    MOGGED
  </text>
  <!-- Crisp white MOGGED text -->
  <text
    x="250"
    y="66"
    text-anchor="middle"
    font-family="Impact, 'Arial Black', 'Plus Jakarta Sans', sans-serif"
    font-weight="900"
    font-size="60"
    letter-spacing="9"
    fill="#FFFFFF"
    stroke="#991B1B"
    stroke-width="1.5"
  >
    MOGGED
  </text>
</svg>
